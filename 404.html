<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Out of bounds</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    .err { min-height: 70vh; display: grid; place-content: center; text-align: center; }
    .err h1 { font-size: clamp(2.4rem, 7vw, 4.5rem); margin: 0 0 12px; color: var(--accent-soft); }
    .err p { color: var(--text-dim); margin: 0 0 26px; }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="err">
    <p class="pixel">GAME OVER</p>
    <h1>404</h1>
    <p>This level does not exist. You are out of bounds.</p>
    <a class="btn btn-primary" href="/">Back to the surface</a>
  </div>
</body>
</html>
